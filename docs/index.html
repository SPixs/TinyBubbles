<style>
  :root { --bg: #161629; --panel: #22223c; --text: #e8e8ff; --muted: #9a9ac8; --gold: #eecc5a; --green: #9ae29b; --red: #fa5c5c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; text-align: center; }
  h1 { font-size: 2.6rem; margin: 0 0 4px; letter-spacing: .5px; }
  .tag { color: var(--muted); margin: 0 0 14px; }
  .winner { display: inline-block; background: var(--gold); color: #2a1f05; font-weight: 700; border-radius: 8px; padding: 3px 12px; margin-bottom: 18px; }
  .size { color: var(--green); font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
  #frame { width: 100%; max-width: 820px; aspect-ratio: 4 / 3; margin: 0 auto; background: #000; border: 6px solid var(--panel); border-radius: 12px; overflow: hidden; }
  .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; margin: 18px 0 8px; color: var(--muted); }
  kbd { background: var(--panel); color: var(--text); border: 1px solid #3a3a60; border-bottom-width: 3px; border-radius: 6px; padding: 1px 8px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; }
  .links a { color: var(--text); text-decoration: none; background: var(--panel); border: 1px solid #3a3a60; border-radius: 8px; padding: 8px 16px; font-weight: 600; }
  .links a.itch { background: var(--red); border-color: var(--red); }
  .links a:hover { filter: brightness(1.15); }
  footer { color: #6f6f99; font-size: .85rem; margin-top: 26px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>TinyBubbles</h1>
  <p class="tag">A bubble shooter for the Commodore 64, in <span class="size">3,810 bytes</span> of 6502 assembly.</p>
  <div class="winner">🏆 Winner · The C64 'Cassette 50' Charity Competition 2021</div>

  <div id="frame"><div id="game"></div></div>

  <div class="keys">
    <span><kbd>←</kbd> <kbd>→</kbd> aim</span>
    <span><kbd>X</kbd> fire</span>
    <span>or a gamepad</span>
  </div>

  <div class="links">
    <a class="itch" href="https://spixs.itch.io/tinybubbles">itch.io page</a>
    <a href="https://github.com/SPixs/TinyBubbles">Source code on GitHub</a>
    <a href="https://github.com/SPixs/TinyBubbles/releases/latest">Download .d64 / .prg</a>
  </div>

  <footer>
    Written in 2021 by Pixs · runs in your browser with <a href="https://emulatorjs.org/">EmulatorJS</a> and <a href="https://vice-emu.sourceforge.io/">VICE</a>
  </footer>
</main>
<script>
  EJS_player = "#game";
  EJS_core = "vice_x64sc";
  EJS_gameUrl = "TinyBubbles.d64";
  EJS_gameName = "TinyBubbles";
